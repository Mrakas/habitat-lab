# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  #- /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - _self_  

habitat:
  environment:
    max_episode_steps: 500
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 1024
            height: 1024
            hfov: 90
            type: HabitatSimRGBSensor
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
      
DATASET:
  TYPE: R2RVLN-v1
  DATA_PATH: data/datasets/R2R1_VLNCE_v0/{split}/{split}.json.gz
  SCENES_DIR: data/scene_datasets/

dataset:
  type: qqq