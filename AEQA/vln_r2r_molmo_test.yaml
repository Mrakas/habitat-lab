ENVIRONMENT:
  MAX_EPISODE_STEPS: 500

SIMULATOR:
  AGENT_0:
    SENSORS: ['RGB_SENSOR', 'SEMANTIC_SENSOR', 'DEPTH_SENSOR']
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 1
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 90
    TYPE: HabitatSimRGBSensor
  SEMANTIC_SENSOR:
    WIDTH: 640
    HEIGHT: 480
  DEPTH_SNSOR: # /mnt/data5/ghx/workplace/vlnce/habitat-lab/habitat/config/default.py 在这里修改 有bug
    WIDTHE: 640
    HEIGHT: 480
    MIN_DEPTH: 0.1
    MAX_DEPTH: 3
    NORMALIZE_DEPTH: True
    TYPE: HabitatSimDepthSensor
TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 3.0
  SENSORS: ['INSTRUCTION_SENSOR','EGOMAP_SENSOR']
  INSTRUCTION_SENSOR_UUID: instruction
  EGOMAP_SENSOR:
    TYPE: "EgoMapSensor"
    MAP_SIZE: 100 #31
    MAP_RESOLUTION: 0.1
    HEIGHT_THRESH: [0.5, 2.0]
    POSITION: [0, 1.25, 0]
    WIDTHE: 640
    HEIGHT: 480
    MIN_DEPTH: 0.1
    MAX_DEPTH: 3
    NORMALIZE_DEPTH: True
  POSSIBLE_ACTIONS: ['STOP', 'MOVE_FORWARD', 'TURN_LEFT', 'TURN_RIGHT']
  #MEASUREMENTS: []
  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'TOP_DOWN_MAP']
  TOP_DOWN_MAP_VLNCE:
    DRAW_SHORTEST_PATH: True
    DRAW_REFERENCE_PATH: True
    DRAW_FIXED_WAYPOINTS: True
    DRAW_MP3D_AGENT_PATH: False
    FOG_OF_WAR:
      DRAW: True
      FOV: 360
  SUCCESS:
    SUCCESS_DISTANCE: 3.0

TASK_CONFIG:
  DATASET:
    EPISODES_ALLOWED: None
DATASET:
  #TYPE: R2RVLN-v1
  TYPE: VLN-CE-v1
  SPLIT: val_unseen
  #DATA_PATH: "data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz"
  DATA_PATH: "data/datasets/vln/R2R_VLNCE_v1-3/{split}/{split}.json.gz"
  SCENES_DIR: "data/scene_datasets/"