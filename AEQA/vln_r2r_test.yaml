ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  AGENT_0:
    SENSORS: ['RGB_SENSOR','RGB_SENSOR_BACK','RGB_SENSOR_RIGHT', 'RGB_SENSOR_LEFT','DEPTH_SENSOR']
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  RGB_SENSOR:
    WIDTH: 1024
    HEIGHT: 1024
    HFOV: 90
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 256
    HEIGHT: 256

  RGB_SENSOR_LEFT:
    WIDTH: 1024
    HEIGHT: 1024
    HFOV: 90
    TYPE: HabitatSimRGBSensor_LEFT
    ORIENTATION: [0, 1.570795, 0]
    POSITION: [0, 1.25, 0]
  RGB_SENSOR_RIGHT:
    WIDTH: 1024
    HEIGHT: 1024
    HFOV: 90
    TYPE: HabitatSimRGBSensor_RIGHT
    ORIENTATION: [0, -1.570795, 0]
    POSITION: [0, 1.25, 0]
  RGB_SENSOR_BACK:
    WIDTH: 1024
    HEIGHT: 1024
    HFOV: 90
    TYPE: HabitatSimRGBSensor_BACK
    ORIENTATION: [0, 3.14159, 0]
    POSITION: [0, 1.25, 0]

TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 3.0
  SENSORS: ['INSTRUCTION_SENSOR']
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: ['STOP', 'MOVE_FORWARD', 'TURN_LEFT', 'TURN_RIGHT']
  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'SUCCESS', 'SPL']
  SUCCESS:
    SUCCESS_DISTANCE: 3.0
DATASET:
  TYPE: R2RVLN-v1
  SPLIT: val_unseen
  DATA_PATH: "data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz"
  SCENES_DIR: "data/scene_datasets/"